name: Native PostgreSQL quality checks
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-owner-only
          POSTGRES_DB: meu_financeiro_smoke_20261125
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:ci-owner-only@127.0.0.1:5432/meu_financeiro_smoke_20261125
      SMOKE_ADMIN_DATABASE_URL: postgresql://postgres:ci-owner-only@127.0.0.1:5432/meu_financeiro_smoke_20261125
      DATABASE_URL: postgresql://financeiro_server:ci-runtime-only@127.0.0.1:5432/meu_financeiro_smoke_20261125
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SMOKE_APP_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-secrets.cjs
      - run: npm run type-check
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --runInBand
      - run: npm run test:audit
      - run: npm run test:database
      - run: node scripts/bootstrap-native.cjs
      - run: npm run build
      - name: Native authentication and financial integration
        run: |
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          cp -r .next/static .next/standalone/.next/static
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/meu-financeiro-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-native.cjs
# Deployments use the Windows service on server 122. No cloud deployment jobs.

  security-scan:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
